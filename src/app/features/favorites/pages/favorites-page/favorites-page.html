<h1>Favoritos</h1>

@if (productStore.loading()) {
  <p>Cargando favoritos...</p>
}

@if (productStore.error()) {
  <p>{{ productStore.error() }}</p>
}

@if (!productStore.loading() && favoriteProducts().length === 0) {
  <p>No tienes productos favoritos todavía.</p>
}

<section>
  @for (product of favoriteProducts(); track product.id) {
    <app-product-card
      [product]="product"
      [isFavorite]="true"
      (favorite)="toggleFavorite($event)"
    />
  }
</section>
